name: Sync site

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download latest package
        run: |
          curl -fL --retry 3 --retry-delay 5 --max-time 300 -o site.zip "https://aka.doubaocdn.com/s/NBxbT1rnke"
          unzip -o -q site.zip -d .
          rm -f site.zip
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html README.md css js assets
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync site content [skip ci]"
            git push
          else
            echo "nothing to commit"
          fi
