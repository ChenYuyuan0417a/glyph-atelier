name: Update site content

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/update.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download and overwrite
        run: |
          curl -fL --retry 3 --retry-delay 5 --max-time 300 -o site.zip "https://aka.doubaocdn.com/s/678423XmIF"
          unzip -o -q site.zip -d .
          rm -f site.zip
          ls -1
      - name: Commit content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html README.md css js assets
          if ! git diff --cached --quiet; then
            git commit -m "chore: update site content [skip ci]"
            git push
          else
            echo "nothing to commit"
          fi
